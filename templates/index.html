<!DOCTYPE html>
<html>

<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>Page Title</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <!-- <link rel='stylesheet' type='text/css' media='screen' href='main.css'> -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

    <script src="{{ url_for('static', filename='js/index.js') }}"></script>
</head>

<body>
    <div class="container pt-4">
        <!-- Table refs -->
        <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#createRefModal">
            Thêm mẫu
        </button>
        <table class="table table-hover mt-8">
            <thead>
                <tr>
                    <th>Reference_id</th>
                    <th>Code</th>
                    <th>Description</th>
                    <th>Image</th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
                {% for ref in refs %}
                <tr>
                    <td>{{ref.id}}</td>
                    <td>{{ref.code}}</td>
                    <td style="word-wrap: break-word; word-break: break-word; white-space: normal; max-width: 250px;">
                        {{ref.description}}</td>
                    <td>
                        <img src={{ref.path}} width="100" height="100" />
                    </td>
                    <td>
                        <div class="d-flex flex-column">
                            <div>
                                <button type="button" class="btn btn-secondary" data-bs-toggle="modal"
                                    data-bs-target="#checkRefModal">Check</button>
                            </div>
                            <div class="mt-3">
                                <button type="button" class="btn btn-warning btn-history" data-bs-toggle="modal"
                                    data-bs-target="#checkRefHistoryModal" data-ref-id="{{ ref.id }}"
                                    onclick="viewHistory()">Lịch sử Check</button>
                            </div>
                        </div>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>


    </div>
    <!-- The Modal -->
    <div class="modal" id="createRefModal">
        <div class="modal-dialog">
            <div class="modal-content">

                <!-- Modal Header -->
                <div class="modal-header">
                    <h4 class="modal-title">Thêm mẫu</h4>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <!-- Modal body -->
                <div class="modal-body">
                    <div id="alert-fail" class="alert alert-warning mb-3" style="display: none;">
                        <strong>Fail!</strong>
                    </div>
                    <div id="alert-success" class="alert alert-success" style="display: none;">
                        <strong>Upload mẫu thành công!</strong>
                    </div>
                    <div class="mb-3 mt-3">
                        <label for="image_url" class="form-label">Link ảnh</label>
                        <input type="url" id="image_url" class="form-control" name="image_url" required
                            onchange="handleOnchange()">
                        <img id="image" />
                    </div>

                    <div class="mb-3 mt-3">
                        <label for="description" class="form-label">Mô tả</label>
                        <textarea id="description" class="form-control" name="description" rows="4" cols="50"
                            placeholder="Nhập mô tả ở đây" required></textarea>
                    </div>

                    <div class="mb-3 mt-3">
                        <label for="code" class="form-label">Mã code</label>
                        <input type="text" id="code" class="form-control" name="code" placeholder="Nhập code" required>
                    </div>
                    <div id='spinner' class="spinner-border" style="display: none;"></div>
                    <button id='uploadBtn' type="button" onclick="submit()" class="btn btn-primary">Upload
                        mẫu</button>
                    <div id='result' class="mt-3" style="display: none;">
                    </div>
                </div>
                <!-- Modal footer -->
                <div class="modal-footer">
                    <button type="button" class="btn btn-danger" data-bs-dismiss="modal">Đóng</button>
                </div>

            </div>
        </div>
    </div>
    <!-- Modal check ref -->
    <div class="modal" id="checkRefModal">
        <div class="modal-dialog">
            <div class="modal-content">

                <!-- Modal Header -->
                <div class="modal-header">
                    <h4 class="modal-title">Check mẫu</h4>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <!-- Modal body -->
                <div class="modal-body">
                    <!-- <div id="alert-fail" class="alert alert-warning mb-3" style="display: none;">
                            <strong>Fail!</strong>
                        </div> -->
                    <!-- <div id="alert-success-check" class="alert alert-success" style="display: none;">
                            <strong>Upload mẫu thành công!</strong>
                        </div> -->
                    <div class="mb-3 mt-3">
                        <label for="image_url_check" class="form-label">Link ảnh</label>
                        <input type="url" id="image_url_check" class="form-control" name="image_url_check" required
                            onchange="handleOnchangeCheck()">
                        <img id="image_check" />
                    </div>
                    <div class="mb-3 mt-3">
                        <label for="code_check" class="form-label">Mã code</label>
                        <input type="text" id="code_check" class="form-control" name="code_check"
                            placeholder="Nhập code" required>
                    </div>
                    <div id='spinnerCheck' class="spinner-border" style="display: none;"></div>
                    <button id='checkBtn' type="button" onclick="check()" class="btn btn-primary">Check
                        mẫu</button>
                    <div id='checkResult' class="mt-3" style="display: none;">
                    </div>
                </div>
                <!-- Modal footer -->
                <div class="modal-footer">
                    <button type="button" class="btn btn-danger" data-bs-dismiss="modal">Đóng</button>
                </div>

            </div>
        </div>
    </div>
    <!-- Modal history check ref -->
    <div class="modal" id="checkRefHistoryModal">
        <div class="modal-dialog modal-xl">
            <div class="modal-content">

                <div class="modal-header">
                    <h4 class="modal-title">Lịch sử check mẫu</h4>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>ReferenceId</th>
                                <th>Testpath</th>
                                <th>Similarity</th>
                                <th>Result</th>
                                <th>Issues</th>
                                <th>Check vào lúc</th>
                            </tr>
                        </thead>
                        <tbody>

                        </tbody>
                    </table>
                </div>
                <!-- Modal footer -->
                <div class="modal-footer">
                    <button type="button" class="btn btn-danger" data-bs-dismiss="modal">Đóng</button>
                </div>

            </div>
        </div>
    </div>
</body>

</html>
